<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyMask - Standalone Offline Secret Decryptor</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --card: #252538;
      --border: #383850;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #22c55e;
      --error: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background-color: #161622;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: monospace;
      font-size: 0.9rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    button:hover {
      background-color: var(--accent-hover);
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result-box.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success);
    }
    .result-box.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }
    .decrypted-value {
      word-break: break-all;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 1rem;
      background: #161622;
      padding: 10px;
      border-radius: 4px;
      margin-top: 8px;
      user-select: all;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      background: var(--border);
      padding: 2px 8px;
      border-radius: 9999px;
      color: var(--muted);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ KeyMask Standalone Decryptor <span class="badge">100% Offline</span></h1>
    <p>This is a zero-dependency, open-standard WebCrypto decryption tool for KeyMask secrets. It runs completely locally in your browser and never sends data over any network. Even without Obsidian installed, you can recover your credentials at any time.</p>

    <div class="form-group">
      <label for="token">Encrypted Token or Code Block</label>
      <textarea id="token" rows="3" placeholder="%%km:v1:label=...:iv=...:data=...:tag=...%% or ```keymask..."></textarea>
    </div>

    <div class="form-group">
      <label for="passphrase">Master Passphrase</label>
      <input type="password" id="passphrase" placeholder="Enter your master passphrase">
    </div>

    <div class="form-group">
      <label for="salt">Vault Salt (Base64 from data.json)</label>
      <input type="text" id="salt" placeholder="e.g. s1EH8IpALrD7lHVySzoP0g==">
    </div>

    <button id="decryptBtn" type="button">🔓 Decrypt Secret</button>

    <div id="resultBox" class="result-box">
      <div id="resultLabel" style="font-weight: 600;"></div>
      <div id="resultText" class="decrypted-value"></div>
    </div>
  </div>

  <script>
    function base64ToUint8(str) {
      let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4 !== 0) b64 += "=";
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    function base64UrlToString(str) {
      const bytes = base64ToUint8(str);
      return new TextDecoder().decode(bytes);
    }

    function parseToken(raw) {
      const trimmed = raw.trim();
      const isKm = trimmed.startsWith("%%km:v1:");
      const isVg = trimmed.startsWith("%%vg:v1:");
      if ((isKm || isVg) && trimmed.endsWith("%%")) {
        const content = trimmed.slice(8, -2);
        const pairs = content.split(":");
        let label, iv, data, tag;
        for (const p of pairs) {
          const idx = p.indexOf("=");
          if (idx === -1) continue;
          const k = p.slice(0, idx);
          const v = p.slice(idx + 1);
          if (k === "label") {
            try { label = base64UrlToString(v); } catch { label = v; }
          } else if (k === "iv") iv = base64ToUint8(v);
          else if (k === "data") data = base64ToUint8(v);
          else if (k === "tag") tag = base64ToUint8(v);
        }
        if (iv && data && tag) return { label, iv, data, tag };
      }
      return null;
    }

    document.getElementById("decryptBtn").addEventListener("click", async () => {
      const tokenStr = document.getElementById("token").value.trim();
      const passphrase = document.getElementById("passphrase").value;
      const saltStr = document.getElementById("salt").value.trim();
      const box = document.getElementById("resultBox");
      const labelEl = document.getElementById("resultLabel");
      const textEl = document.getElementById("resultText");

      box.className = "result-box";
      box.style.display = "none";

      if (!tokenStr || !passphrase || !saltStr) {
        box.className = "result-box error";
        labelEl.textContent = "Error";
        textEl.textContent = "Please fill in all fields (token, passphrase, and salt).";
        return;
      }

      try {
        const payload = parseToken(tokenStr);
        if (!payload) throw new Error("Could not parse token format. Expected %%km:v1:...%%");

        const saltBytes = base64ToUint8(saltStr);
        const encoder = new TextEncoder();
        const passBytes = encoder.encode(passphrase);

        // PBKDF2 Key Derivation (600,000 iterations, SHA-256)
        const baseKey = await crypto.subtle.importKey("raw", passBytes, "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: saltBytes, iterations: 600000, hash: "SHA-256" },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        // AES-256-GCM Decryption
        const combined = new Uint8Array(payload.data.byteLength + payload.tag.byteLength);
        combined.set(payload.data, 0);
        combined.set(payload.tag, payload.data.byteLength);

        const decryptedBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: payload.iv, tagLength: 128 },
          key,
          combined
        );

        const plaintext = new TextDecoder().decode(decryptedBuf);
        box.className = "result-box success";
        labelEl.textContent = `✅ Successfully Decrypted (${payload.label || "Secret"}):`;
        textEl.textContent = plaintext;
      } catch (err) {
        box.className = "result-box error";
        labelEl.textContent = "Decryption Failed";
        textEl.textContent = err.message || "Authentication tag mismatch. Check your passphrase or salt.";
      }
    });
  </script>
</body>
</html>
